name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI script (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash ./ci.sh

      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
